services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baron_capital}
      POSTGRES_USER: ${POSTGRES_USER:-baron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baron}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-baron} -d ${POSTGRES_DB:-baron_capital}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend-core:
    build: ../backend
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
    volumes:
      - ../backend:/app

  frontend:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - backend-core
    ports:
      - '3000:80'

volumes:
  pgdata:
