apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: baron-capital
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: REGISTRY/baron-capital-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '250m'
              memory: '256Mi'
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: baron-capital
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
