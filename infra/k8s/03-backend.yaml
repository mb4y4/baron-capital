# NOTE: This deploys the Django backend as a single service exposing all
# four microservice apps (core, payments, compliance, loan-calculator) under
# one deployment, matching how they're structured in backend/apps/. If/when
# any app needs to scale or deploy independently, split it into its own
# Django project + Dockerfile and duplicate this Deployment/Service pattern
# for it, pointing the Ingress path at the new Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-core
  namespace: baron-capital
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-core
  template:
    metadata:
      labels:
        app: backend-core
    spec:
      containers:
        - name: backend-core
          image: REGISTRY/baron-capital-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: baron-secrets
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://baroncapital.co.ke"
          readinessProbe:
            httpGet:
              path: /api/core/branches/
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/core/branches/
              port: 8000
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: '250m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
---
apiVersion: v1
kind: Service
metadata:
  name: backend-core
  namespace: baron-capital
spec:
  selector:
    app: backend-core
  ports:
    - port: 8000
      targetPort: 8000
